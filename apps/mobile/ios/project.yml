name: Logion

options:
  bundleIdPrefix: work.logion
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: true
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 5.0

targets:
  Logion:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Config/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: work.logion.app

schemes:
  Logion:
    build:
      targets:
        Logion: all
    run:
      config: Debug
    archive:
      config: Release
