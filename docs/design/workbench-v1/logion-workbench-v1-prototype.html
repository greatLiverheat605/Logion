<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logion Workbench v1 原型</title>
    <style>
      :root,
      :root[data-theme="light"] {
        color-scheme: light;
        --outer: #dfe6e3;
        --canvas: #f3f6f5;
        --sidebar: #e9efed;
        --surface: #ffffff;
        --surface-muted: #edf2f0;
        --surface-strong: #e2e9e6;
        --ink: #17201d;
        --ink-2: #4e5d57;
        --ink-3: #5e6e67;
        --line: #d6dedb;
        --line-strong: #becbc6;
        --primary: #0b756a;
        --primary-2: #075e56;
        --primary-soft: #dcefeb;
        --success: #26734f;
        --success-soft: #e1f0e7;
        --warning: #8a6414;
        --warning-soft: #f5ecd4;
        --danger: #a43d3d;
        --danger-soft: #f7e2e2;
        --candidate: #5f62a7;
        --candidate-soft: #e8e8f5;
        --shadow: 0 1px 3px rgba(19, 38, 31, 0.08);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --outer: #0c100f;
        --canvas: #181d1b;
        --sidebar: #131816;
        --surface: #232a27;
        --surface-muted: #2b3430;
        --surface-strong: #34413c;
        --ink: #eef6f3;
        --ink-2: #b6c4be;
        --ink-3: #99aba2;
        --line: #36433e;
        --line-strong: #4a5a53;
        --primary: #63c9b8;
        --primary-2: #8dd9cc;
        --primary-soft: #203f39;
        --success: #70c894;
        --success-soft: #253d30;
        --warning: #e2bd68;
        --warning-soft: #41371f;
        --danger: #ef8b8b;
        --danger-soft: #482b2b;
        --candidate: #aaaef4;
        --candidate-soft: #32334c;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.42);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow-x: hidden;
        background: var(--outer);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", system-ui, sans-serif;
        letter-spacing: 0;
      }

      button,
      input,
      select {
        font: inherit;
        letter-spacing: 0;
      }

      button {
        color: inherit;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .prototype-bar {
        position: sticky;
        z-index: 20;
        top: 0;
        display: flex;
        min-height: 54px;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--line-strong);
        background: color-mix(in srgb, var(--surface) 94%, transparent);
        backdrop-filter: blur(12px);
      }

      .prototype-title {
        display: flex;
        min-width: 222px;
        align-items: baseline;
        gap: 8px;
      }

      .prototype-title strong {
        font-size: 14px;
      }

      .prototype-title span {
        color: var(--ink-3);
        font-size: 11px;
      }

      .prototype-tools {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 8px;
        overflow-x: auto;
      }

      .segments {
        display: inline-flex;
        flex: none;
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface-muted);
      }

      .segment,
      .tool-button,
      .button,
      .icon-button,
      .tab,
      .nav-item,
      .mobile-nav-item,
      .row-button,
      .module-toggle,
      .object-chip {
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .segment {
        min-height: 30px;
        padding: 0 11px;
        border-radius: 5px;
        color: var(--ink-2);
        font-size: 12px;
      }

      .segment[aria-pressed="true"] {
        background: var(--surface);
        box-shadow: var(--shadow);
        color: var(--primary);
        font-weight: 650;
      }

      .tool-select {
        min-width: 154px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
        color: var(--ink);
        padding: 0 30px 0 10px;
        font-size: 12px;
      }

      .tool-button,
      .icon-button {
        display: inline-grid;
        width: 34px;
        height: 34px;
        flex: none;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
        place-items: center;
      }

      .tool-button svg,
      .icon-button svg,
      .search-button svg,
      .nav-icon svg,
      .button svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .stage {
        position: relative;
        display: grid;
        min-height: calc(100vh - 54px);
        justify-items: center;
        overflow: auto;
        padding: 14px;
      }

      .device-frame {
        position: relative;
        width: 100%;
      }

      .device {
        position: absolute;
        top: 0;
        left: 50%;
        display: grid;
        width: 1440px;
        height: 900px;
        grid-template-columns: 232px minmax(0, 1fr) 320px;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: var(--canvas);
        box-shadow: 0 16px 45px rgba(10, 25, 20, 0.17);
        transform: translateX(-50%) scale(var(--device-scale, 1));
        transform-origin: top center;
      }

      .device[data-viewport="1024"] {
        width: 1024px;
        height: 768px;
        grid-template-columns: 196px minmax(0, 1fr);
      }

      .device[data-viewport="1440"][data-inspector-open="false"] {
        grid-template-columns: 232px minmax(0, 1fr);
      }

      .device[data-viewport="390"],
      .device[data-viewport="320"] {
        height: 844px;
        grid-template-columns: 1fr;
        border-radius: 16px;
      }

      .device[data-viewport="390"] {
        width: 390px;
      }

      .device[data-viewport="320"] {
        width: 320px;
        height: 720px;
      }

      .sidebar {
        display: flex;
        min-width: 0;
        flex-direction: column;
        padding: 18px 14px;
        border-right: 1px solid var(--line);
        background: var(--sidebar);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 8px 20px;
      }

      .brand-mark {
        display: grid;
        width: 32px;
        height: 32px;
        border: 1px solid color-mix(in srgb, var(--primary) 68%, var(--line));
        border-radius: 8px;
        color: var(--primary);
        font-family: Georgia, serif;
        font-size: 17px;
        place-items: center;
      }

      .brand-copy strong,
      .brand-copy small {
        display: block;
      }

      .brand-copy strong {
        font-size: 14px;
      }

      .brand-copy small {
        margin-top: 2px;
        color: var(--ink-3);
        font-size: 10px;
      }

      .nav-list {
        display: grid;
        gap: 4px;
      }

      .nav-item {
        display: grid;
        min-height: 40px;
        grid-template-columns: 22px 1fr auto;
        align-items: center;
        gap: 9px;
        padding: 0 10px;
        border-radius: 7px;
        color: var(--ink-2);
        text-align: left;
      }

      .nav-item:hover,
      .nav-item[aria-current="page"] {
        background: var(--primary-soft);
        color: var(--primary);
      }

      .nav-item[aria-current="page"] {
        font-weight: 650;
      }

      .nav-icon {
        display: grid;
        place-items: center;
      }

      .nav-code {
        color: var(--ink-3);
        font-family: ui-monospace, "Cascadia Code", monospace;
        font-size: 9px;
      }

      .nav-divider {
        height: 1px;
        margin: 10px 8px;
        background: var(--line);
      }

      .sidebar-foot {
        display: grid;
        gap: 8px;
        margin-top: auto;
        padding: 14px 8px 0;
        border-top: 1px solid var(--line);
        color: var(--ink-3);
        font-size: 10px;
      }

      .foot-row {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--success);
      }

      .app-main {
        display: flex;
        min-width: 0;
        min-height: 0;
        flex-direction: column;
      }

      .context-bar {
        display: flex;
        min-height: 44px;
        align-items: center;
        gap: 8px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--surface) 88%, var(--canvas));
      }

      .context-path {
        display: flex;
        min-width: 0;
        flex: 1;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }

      .context-path strong {
        white-space: nowrap;
      }

      .context-path span {
        overflow: hidden;
        color: var(--ink-3);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .search-button {
        display: flex;
        min-width: 174px;
        height: 32px;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
        color: var(--ink-3);
        font-size: 11px;
        cursor: pointer;
      }

      .search-button kbd {
        margin-left: auto;
        color: var(--ink-3);
        font-family: ui-monospace, "Cascadia Code", monospace;
        font-size: 9px;
      }

      .page-scroll {
        min-height: 0;
        flex: 1;
        overflow: auto;
      }

      .page {
        display: grid;
        width: 100%;
        min-width: 0;
        gap: 18px;
        padding: 24px 26px 32px;
      }

      .page > *,
      .two-col > *,
      .learning-layout > *,
      .research-layout > *,
      .exam-layout > *,
      .mentor-layout > *,
      .custom-layout > *,
      .knowledge-layout > * {
        min-width: 0;
      }

      .page-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
      }

      .page-head h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
      }

      .page-head p {
        max-width: 650px;
        margin: 6px 0 0;
        color: var(--ink-2);
        font-size: 12px;
        line-height: 1.6;
      }

      .head-actions,
      .button-row,
      .meta-row,
      .panel-head,
      .workbench-context,
      .object-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .button {
        display: inline-flex;
        min-height: 34px;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
        color: var(--ink-2);
        font-size: 12px;
        font-weight: 600;
      }

      .button:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }

      .button.primary {
        border-color: var(--primary-2);
        background: var(--primary);
        color: #ffffff;
      }

      :root[data-theme="dark"] .button.primary {
        color: #10201c;
      }

      .button.danger {
        border-color: color-mix(in srgb, var(--danger) 42%, var(--line));
        color: var(--danger);
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.52;
      }

      .eyebrow,
      .section-label {
        color: var(--ink-3);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .section-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        letter-spacing: 0;
        text-transform: none;
      }

      .section-label span {
        font-weight: 500;
      }

      .surface,
      .panel,
      .object-row,
      .metric-strip,
      .state-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .panel {
        overflow: hidden;
      }

      .panel-head {
        min-height: 42px;
        justify-content: space-between;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
      }

      .panel-head strong {
        font-size: 12px;
      }

      .panel-head small {
        color: var(--ink-3);
        font-size: 10px;
      }

      .pill {
        display: inline-flex;
        min-height: 21px;
        align-items: center;
        padding: 0 7px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface-muted);
        color: var(--ink-2);
        font-size: 9px;
        font-weight: 650;
        white-space: nowrap;
      }

      .pill.primary {
        border-color: color-mix(in srgb, var(--primary) 30%, var(--line));
        background: var(--primary-soft);
        color: var(--primary);
      }

      .pill.success {
        border-color: color-mix(in srgb, var(--success) 32%, var(--line));
        background: var(--success-soft);
        color: var(--success);
      }

      .pill.warning {
        border-color: color-mix(in srgb, var(--warning) 34%, var(--line));
        background: var(--warning-soft);
        color: var(--warning);
      }

      .pill.candidate {
        border-color: color-mix(in srgb, var(--candidate) 34%, var(--line));
        background: var(--candidate-soft);
        color: var(--candidate);
      }

      .state-panel {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 13px 14px;
        border-left: 3px solid var(--warning);
        box-shadow: none;
      }

      .state-panel.error,
      .state-panel.permission {
        border-left-color: var(--danger);
      }

      .state-panel.success {
        border-left-color: var(--success);
      }

      .state-copy {
        min-width: 0;
        flex: 1;
      }

      .state-copy strong,
      .state-copy span {
        display: block;
      }

      .state-copy strong {
        font-size: 12px;
      }

      .state-copy span {
        margin-top: 3px;
        color: var(--ink-2);
        font-size: 10px;
        line-height: 1.5;
      }

      .request-id {
        color: var(--ink-3);
        font-family: ui-monospace, "Cascadia Code", monospace;
        font-size: 9px;
      }

      .workbench-switcher {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 4px;
        padding-bottom: 1px;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
      }

      .tab {
        position: relative;
        min-height: 38px;
        flex: none;
        padding: 0 14px;
        color: var(--ink-2);
        font-size: 12px;
      }

      .tab[aria-selected="true"] {
        color: var(--primary);
        font-weight: 700;
      }

      .tab[aria-selected="true"]::after {
        position: absolute;
        right: 8px;
        bottom: -1px;
        left: 8px;
        height: 2px;
        background: var(--primary);
        content: "";
      }

      .workbench-context {
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
        padding: 13px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: color-mix(in srgb, var(--primary-soft) 52%, var(--surface));
      }

      .context-copy strong,
      .context-copy span {
        display: block;
      }

      .context-copy strong {
        font-size: 13px;
      }

      .context-copy span {
        margin-top: 4px;
        color: var(--ink-2);
        font-size: 10px;
      }

      .context-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .today-action {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 176px;
        overflow: hidden;
      }

      .today-copy {
        padding: 22px;
      }

      .today-copy h2 {
        max-width: 640px;
        margin: 12px 0 18px;
        font-size: 22px;
        line-height: 1.35;
      }

      .today-meta {
        display: grid;
        margin: 0;
      }

      .today-meta > div {
        display: grid;
        grid-template-columns: 82px minmax(0, 1fr);
        gap: 14px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }

      .today-meta dt,
      .today-meta dd {
        margin: 0;
        font-size: 11px;
        line-height: 1.55;
      }

      .today-meta dt {
        color: var(--ink-3);
      }

      .today-side {
        display: grid;
        align-content: start;
        gap: 10px;
        padding: 18px;
        border-left: 1px solid var(--line);
        background: var(--surface-muted);
      }

      .today-side strong {
        font-size: 11px;
      }

      .evidence-step {
        display: grid;
        grid-template-columns: 26px 1fr;
        gap: 8px;
        align-items: start;
        color: var(--ink-2);
        font-size: 10px;
        line-height: 1.4;
      }

      .evidence-step span:first-child,
      .index {
        display: grid;
        width: 24px;
        height: 24px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--primary);
        font-family: ui-monospace, "Cascadia Code", monospace;
        font-size: 9px;
        place-items: center;
      }

      .object-list {
        display: grid;
        gap: 8px;
      }

      .object-row,
      .row-button {
        display: grid;
        width: 100%;
        min-height: 56px;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        text-align: left;
      }

      .object-row:hover,
      .row-button:hover {
        border-color: var(--line-strong);
        background: color-mix(in srgb, var(--primary-soft) 30%, var(--surface));
      }

      .row-copy {
        min-width: 0;
      }

      .row-copy strong,
      .row-copy small {
        display: block;
      }

      .row-copy strong {
        overflow: hidden;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row-copy small {
        margin-top: 4px;
        overflow: hidden;
        color: var(--ink-3);
        font-size: 9px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .metric-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        overflow: hidden;
      }

      .metric {
        min-width: 0;
        padding: 13px 14px;
        border-right: 1px solid var(--line);
      }

      .metric:last-child {
        border-right: 0;
      }

      .metric strong,
      .metric span,
      .metric small {
        display: block;
      }

      .metric span {
        color: var(--ink-3);
        font-size: 9px;
      }

      .metric strong {
        margin-top: 7px;
        font-size: 17px;
      }

      .metric small {
        margin-top: 5px;
        color: var(--ink-2);
        font-size: 9px;
        line-height: 1.4;
      }

      .two-col,
      .learning-layout,
      .research-layout,
      .exam-layout,
      .mentor-layout,
      .custom-layout,
      .knowledge-layout {
        display: grid;
        align-items: stretch;
        gap: 12px;
      }

      .two-col {
        grid-template-columns: 1.15fr 1fr;
      }

      .learning-layout {
        grid-template-columns: minmax(0, 1.35fr) minmax(240px, 0.65fr);
      }

      .research-layout {
        grid-template-columns: 250px minmax(0, 1fr);
      }

      .exam-layout {
        grid-template-columns: minmax(0, 1.3fr) minmax(260px, 0.7fr);
      }

      .mentor-layout {
        grid-template-columns: minmax(260px, 0.76fr) minmax(0, 1.24fr);
      }

      .custom-layout {
        grid-template-columns: 274px minmax(0, 1fr);
      }

      .knowledge-layout {
        grid-template-columns: 240px minmax(0, 1fr);
      }

      .track {
        position: relative;
        display: grid;
        gap: 0;
        padding: 18px 16px;
      }

      .track::before {
        position: absolute;
        top: 32px;
        bottom: 32px;
        left: 29px;
        width: 1px;
        background: var(--line-strong);
        content: "";
      }

      .track-step {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 28px 1fr auto;
        align-items: center;
        gap: 10px;
        min-height: 52px;
      }

      .track-node {
        display: grid;
        width: 27px;
        height: 27px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--surface);
        color: var(--ink-3);
        font-family: ui-monospace, "Cascadia Code", monospace;
        font-size: 9px;
        place-items: center;
      }

      .track-step.current .track-node,
      .track-step.done .track-node {
        border-color: var(--primary);
        background: var(--primary-soft);
        color: var(--primary);
      }

      .track-copy strong,
      .track-copy small {
        display: block;
      }

      .track-copy strong {
        font-size: 11px;
      }

      .track-copy small {
        margin-top: 3px;
        color: var(--ink-3);
        font-size: 9px;
      }

      .source-list .row-button {
        grid-template-columns: 28px minmax(0, 1fr);
        border-bottom: 1px solid var(--line);
        border-radius: 0;
      }

      .source-list .row-button:last-child {
        border-bottom: 0;
      }

      .evidence-lab {
        position: relative;
        min-height: 330px;
        overflow: hidden;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 32px 32px;
      }

      .mobile-evidence-list,
      .mobile-coverage-list,
      .mobile-graph-list {
        display: none;
      }

      .mobile-evidence-list .row-button[aria-current],
      .mobile-graph-list .row-button[aria-current] {
        border-color: color-mix(in srgb, var(--primary) 50%, var(--line));

      .lab-path {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .lab-path path {
        fill: none;
        stroke: var(--line-strong);
        stroke-opacity: 0.28;
        stroke-width: 1.4;
      }

      .lab-path path.related {
        stroke-opacity: 1;
      }

      .lab-path path.confirmed {
        stroke: var(--primary);
      }

      .lab-path path.candidate {
        stroke: var(--candidate);
        stroke-dasharray: 5 5;
      }

      .lab-node {
        position: absolute;
        display: grid;
        min-width: 112px;
        min-height: 52px;
        padding: 8px 10px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: color-mix(in srgb, var(--surface) 93%, transparent);
        box-shadow: var(--shadow);
        cursor: pointer;

      .lab-node[aria-pressed="true"] {
        border-color: var(--primary);

      .lab-node strong {
        font-size: 10px;
      }

      .lab-node small {
        margin-top: 4px;
        color: var(--ink-3);
        font-family: ui-monospace, "Cascadia Code", monospace;
        font-size: 8px;
      }

      .lab-node.question {
        top: 38%;
        left: 6%;
      }

      .lab-node.source {
        top: 12%;
        left: 40%;
      }

      .lab-node.claim {
        top: 39%;
        left: 42%;
      }

      .lab-node.run {
        right: 6%;
        bottom: 13%;
      }

      .lab-node.draft {
        top: 12%;
        right: 7%;

      }

      .run-strip {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid var(--line);
      }

      .run-step {
        position: relative;
        min-height: 55px;
        padding: 11px 12px;
        border-right: 1px solid var(--line);
      }

      .run-step:last-child {
        border-right: 0;
      }

      .run-step strong,
      .run-step span {
        display: block;
      }

      .run-step strong {
        font-family: ui-monospace, "Cascadia Code", monospace;
        font-size: 9px;
      }

      .run-step span {
        margin-top: 5px;
        color: var(--ink-3);
        font-size: 8px;
      }

      .coverage-grid {
        display: grid;
        grid-template-columns: minmax(130px, 1.4fr) repeat(

            minmax(42px, 0.65fr)

        padding: 12px;

      .coverage-cell {
        display: grid;
        min-height: 42px;
        align-items: center;
        padding: 6px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);

        font-size: 9px;
        text-align: center;

      .coverage-cell.label {

        color: var(--ink);
        font-weight: 650;
        text-align: left;

      .coverage-cell.covered {
        background: var(--success-soft);
        color: var(--success);
      }

      .coverage-cell.weak {
        background: var(--warning-soft);

      .coverage-cell.open {

      .trend-line {

      .bar {

      .bar span {

      .review-column {

      .input,

      .module-toggle {

        gap: 12px;
        padding: 11px 12px;

        border-radius: 7px;
        background: var(--success-soft);

      .object-chip {

        gap: 10px;
        padding: 0 10px;
        border: 1px solid var(--line);

        background: var(--surface);
        text-align: left;

      .object-chip strong {
        font-size: 10px;

      .object-chip span {
        color: var(--ink-3);
        font-size: 8px;

      .graph-canvas {
        position: relative;
        min-height: 420px;
        overflow: hidden;
        background: var(--canvas);
      }

      .graph-node {
        position: absolute;
        min-width: 94px;
        min-height: 38px;
        padding: 7px 9px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--surface);
        color: var(--ink);
        font-size: 9px;
        cursor: pointer;
      }

      .graph-node[aria-pressed="true"] {
        border-color: var(--primary);

        color: var(--primary);

      .graph-node.g1 {
        top: 42%;
        left: 39%;
      }
      .graph-node.g2 {
        top: 14%;
        left: 17%;
      }
      .graph-node.g3 {
        top: 13%;
        right: 15%;
      }
      .graph-node.g4 {
        bottom: 15%;
        left: 17%;
      }
      .graph-node.g5 {
        right: 13%;
        bottom: 16%;
        border-style: dashed;
      }

      .inspector {
        display: none;
        min-width: 0;
        min-height: 0;
        flex-direction: column;
        border-left: 1px solid var(--line);
        background: var(--surface);
      }

      .inspector.open {
        display: flex;
      }

      .inspector-head {
        display: flex;
        min-height: 44px;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);

      .inspector-head strong {

        font-size: 12px;

      .inspector-body {
        min-height: 0;

      }

      .inspector-section {
        padding: 15px;
        border-bottom: 1px solid var(--line);
      }

      .inspector-section h3 {
        margin: 0 0 7px;
        font-size: 11px;
      }

      .inspector-section p {
        margin: 0;
        color: var(--ink-2);
        font-size: 10px;
        line-height: 1.6;
      }

      .code-block {
        display: grid;
        gap: 4px;
        margin-top: 10px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface-muted);
        color: var(--ink-2);
        font-family: ui-monospace, "Cascadia Code", monospace;
        font-size: 8px;

        display: grid;

        padding: 24px;
        color: var(--ink-3);

        text-align: center;

      .mobile-nav {
        display: none;
      }

      .toast {
        position: fixed;
        z-index: 60;
        right: 22px;
        bottom: 22px;
        display: none;
        max-width: 340px;
        padding: 11px 13px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: var(--surface);
        box-shadow: 0 12px 30px rgba(7, 25, 19, 0.22);
        color: var(--ink);
        font-size: 11px;
      }

      .toast.visible {
        display: block;
      }

      .overlay {
        position: fixed;
        z-index: 50;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(9, 17, 14, 0.48);
      }

      .overlay.open {
        display: flex;
      }

      .dialog {
        width: min(480px, 100%);
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 24px 70px rgba(4, 15, 11, 0.35);

      .dialog-head,
      .dialog-foot {
        display: flex;
        min-height: 50px;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
      }

      .dialog-head {
        border-bottom: 1px solid var(--line);
      }

      .dialog-head strong {
        flex: 1;
        font-size: 13px;
      }

      .dialog-body {
        display: grid;
        gap: 12px;
        padding: 16px;
      }

      .dialog-body p {
        margin: 0;
        color: var(--ink-2);
        font-size: 11px;
        line-height: 1.6;
      }

      .dialog-foot {
        justify-content: flex-end;
        border-top: 1px solid var(--line);
      }

      .skeleton {
        height: 11px;
        border-radius: 4px;
        background: var(--surface-strong);
      }

      .skeleton + .skeleton {
        margin-top: 9px;
      }

      .empty-state {
        display: grid;
        min-height: 260px;
        padding: 28px;
        place-items: center;
        text-align: center;
      }

      .empty-state h2 {
        margin: 0;
        font-size: 16px;
      }

      .empty-state p {
        max-width: 420px;
        margin: 8px 0 16px;
        color: var(--ink-2);
        font-size: 11px;
        line-height: 1.6;
      }

      .device[data-viewport="390"] .search-button span,

      .device[data-viewport="390"] .page-head,
      .device[data-viewport="320"] .page-head {
        align-items: stretch;

      .device[data-viewport="390"] .head-actions,

      .device[data-viewport="390"] .button,

      .device[data-viewport="390"] .today-action,

      .device[data-viewport="390"] .mobile-evidence-list,

      .device[data-viewport="390"] .coverage-grid,

          return `<div class="page">${pageHead("知识库", "同一知识引擎只投影当前已授权对象。")}${statusPanel()}<section class="surface" style="padding:18px"><div class="skeleton" style="width:38%"></div><div class="skeleton" style="width:78%"></div><div class="skeleton" style="width:63%"></div></section></div>`;
        const mode = workbenches[state.workbench];
        return `<div class="page">${pageHead("知识库", "同一知识引擎根据当前工作台改变默认节点、筛选和建议动作。", `<button class="button" type="button">筛选</button><button class="button primary" type="button">快速捕获</button>`)}${statusPanel()}${workbenchContext()}<div class="knowledge-layout"><section class="panel source-list"><div class="panel-head"><strong>${mode.label}投影</strong><small>授权对象</small></div><button class="row-button" type="button" data-inspector="source"><span class="index">S1</span><span class="row-copy"><strong>RAG Evaluation Survey</strong><small>${state.sourceLinkedToLearning ? "研究、学习工作台引用" : "研究工作台引用"}</small></span></button><button class="row-button" type="button" data-inspector="topic"><span class="index">T1</span><span class="row-copy"><strong>证据充分性</strong><small>正式主题 · 6 条关系</small></span></button></section><section class="panel"><div class="panel-head"><strong>局部关系图</strong><span class="pill ${state.pageState === "truncated" ? "warning" : "primary"}">${state.pageState === "truncated" ? "已截断" : "1 跳 · 5 节点"}</span></div><div class="mobile-graph-list" aria-label="局部关系图等价列表"><button class="row-button" type="button" data-inspector="topic"><span class="index">T</span><span class="row-copy"><strong>证据充分性</strong><small>中心主题 · 4 条可见关系</small></span><span class="pill primary">中心</span></button><button class="row-button" type="button" data-inspector="source"><span class="index">S</span><span class="row-copy"><strong>来源 v4</strong><small>正式来源 · 支持中心主题</small></span></button><button class="row-button" type="button" data-inspector="claim"><span class="index">C</span><span class="row-copy"><strong>声明 C-12</strong><small>待人工复核</small></span></button><button class="row-button" type="button" data-inspector="run"><span class="index">R</span><span class="row-copy"><strong>实验运行 #48</strong><small>等待人工解释</small></span></button><button class="row-button" type="button" data-inspector="draftEvidence"><span class="index">D</span><span class="row-copy"><strong>候选证据</strong><small>AI Draft · 未应用</small></span><span class="pill">候选</span></button></div><div class="graph-canvas"><svg class="lab-path" viewBox="0 0 700 420" preserveAspectRatio="none" aria-hidden="true"><path class="confirmed" d="M350 200 C270 95 190 95 130 82"/><path d="M360 200 C455 100 530 90 610 82"/><path class="confirmed" d="M350 220 C265 305 190 330 130 350"/><path class="candidate" d="M370 220 C470 305 535 330 610 350"/></svg><button class="graph-node g1" type="button" data-inspector="topic" aria-pressed="true">证据充分性</button><button class="graph-node g2" type="button" data-inspector="source" aria-pressed="false">来源 v4</button><button class="graph-node g3" type="button" data-inspector="claim" aria-pressed="false">声明 C-12</button><button class="graph-node g4" type="button" data-inspector="run" aria-pressed="false">实验运行 #48</button><button class="graph-node g5" type="button" data-inspector="draftEvidence" aria-pressed="false">AI 候选</button></div></section></div></div>`;
      }

      function collaborationPage() {
        if (state.pageState === "permission")
          return `<div class="page">${pageHead("协作空间", "Workspace 管成员和治理，Shared Space 管共享对象范围。")}${permissionState("协作空间")}</div>`;
        return `<div class="page">${pageHead("协作空间", "Workspace 管成员和治理，Shared Space 管共享对象范围。", `<button class="button">成员与权限</button>`)}${statusPanel()}<div class="workbench-context"><div class="context-copy"><strong>共享研究库</strong><span>Workspace：Logion Lab · 当前权限角色：Owner</span></div><div class="context-meta"><span class="pill success">Shared Space</span><span class="pill">导师工作台不授予权限</span></div></div>${mentorPage()}</div>`;
      }

      function systemPage() {
        if (state.pageState === "permission")
          return `<div class="page">${pageHead("系统中心", "管理账户偏好、数据、安全和工作台配置。")}${permissionState("系统设置")}</div>`;
        return `<div class="page">${pageHead("系统中心", "管理账户偏好、数据、安全和工作台配置。", "")}${statusPanel()}<div class="two-col"><section class="panel"><div class="panel-head"><strong>工作台</strong><small>界面投影偏好</small></div><div class="object-list" style="padding:10px">${Object.entries(
          workbenches,
        )
          .map(
            ([key, value]) =>
              `<button class="row-button" type="button" data-workbench="${key}"><span class="index">${value.label}</span><span class="row-copy"><strong>${value.label}工作台</strong><small>默认知识库：${value.space}</small></span><span class="pill ${key === state.workbench ? "primary" : ""}">${key === state.workbench ? "当前" : key === "custom" ? "自定义" : "固定"}</span></button>`,
          )
          .join(
            "",
          )}</div></section><section class="panel"><div class="panel-head"><strong>权限边界</strong><small>只读说明</small></div><div class="config-section"><h3>Workspace Role</h3><p style="margin:0;color:var(--ink-2);font-size:10px;line-height:1.6">Owner。切换工作台不会改变此角色。</p></div><div class="config-section"><h3>知识库范围</h3><p style="margin:0;color:var(--ink-2);font-size:10px;line-height:1.6">默认知识库只影响入口和筛选；每次读取仍由服务端重新授权。</p></div><div class="config-section"><h3>旧画像迁移</h3><p style="margin:0;color:var(--ink-2);font-size:10px;line-height:1.6">现有名称、图标和路由偏好只作为 Workbench v1 的迁移来源。</p></div></section></div></div>`;
      }

      function objectReferences(object) {
        const references = {
          source: state.sourceLinkedToLearning
            ? "研究工作台、学习工作台；正式 Source 仍只有一份。"
            : "研究工作台；正式 Source 仍只有一份。",
          sourceLab: "研究工作台。",
          sourceDict: "研究工作台。",
          sourceNotes: "学习工作台、研究工作台；正式笔记仍只有一份。",
          draftEvidence: "研究工作台；仍是 AI Draft，尚未应用。",
          deliverable: "学习工作台。",
          exam: "考试工作台。",
          review: "导师工作台中的授权只读投影。",
        };
        return (
          references[object] || `${workbenches[state.workbench].label}工作台。`
        );
      }

      function inspector() {
        const data = inspectorData[state.inspectorObject];
        const blockedMessage =
          state.pageState === "permission"
            ? "此范围未授权，不返回对象、引用、历史或存在性。"
            : state.pageState === "locked"
              ? "Vault 已锁定。解锁前不显示本机敏感对象详情。"
              : null;
        const modalAttributes = ["390", "320"].includes(state.viewport)
          ? ' role="dialog" aria-modal="true" aria-labelledby="inspector-title"'
          : "";
        const content = blockedMessage
          ? `<div class="inspector-empty" role="status">${blockedMessage}</div>`
          : data
            ? `<div class="inspector-body"><section class="inspector-section"><h3>${data.title}</h3><p>${data.kind}</p><div class="code-block"><span>id ${data.id}</span><span>version ${data.version}</span><span>space ${data.ownerSpace}</span></div><div class="button-row" style="margin-top:10px"><button class="button" type="button" data-action="open-origin">返回原始对象</button></div></section><section class="inspector-section"><h3>内容</h3><p>${data.content}</p></section><section class="inspector-section"><h3>来源与状态</h3><p>${data.source}</p><div class="button-row" style="margin-top:10px"><span class="pill primary">${data.status}</span></div></section><section class="inspector-section"><h3>授权</h3><p>仅投影当前用户已获权访问的对象；失权后不返回对象或引用是否存在。</p></section><section class="inspector-section"><h3>工作台引用</h3><p>${objectReferences(state.inspectorObject)}</p>${state.inspectorObject === "source" ? `<div class="button-row" style="margin-top:10px"><button class="button" type="button" data-action="link-source">${state.pageState === "disabled" ? "引用能力未开放" : state.sourceLinkedToLearning ? "从学习工作台移除引用" : "添加到学习工作台"}</button><button class="button danger" type="button" data-action="delete-object">删除正式对象</button></div>` : ""}</section><section class="inspector-section"><h3>历史</h3><p>11:24 读取当前版本<br>11:21 同步收据已写入<br>昨日 18:42 更新对象</p></section></div>`
            : '<div class="inspector-empty">选择对象后查看来源、关系、状态、历史和操作。</div>';
        return `<aside class="inspector ${state.inspectorOpen ? "open" : ""}" aria-label="对象检查器"${modalAttributes}><div class="inspector-head"><strong id="inspector-title">Inspector</strong><span class="pill">只读投影</span><button class="icon-button" type="button" data-action="close-inspector" aria-label="关闭检查器">${icon("close")}</button></div>${content}</aside>`;
      }

      function mobileNav() {
        return `<nav class="mobile-nav" aria-label="移动主导航">${navItems.map((item) => navButton(item, true)).join("")}</nav>`;
      }

      function resolveInspectorObject(button) {
        return button.dataset.inspector;
      }

      function applyRenderedState(device) {
        device.dataset.inspectorOpen = String(state.inspectorOpen);
        const mobileInspectorOpen =
          state.inspectorOpen && ["390", "320"].includes(state.viewport);
        const appMain = device.querySelector(".app-main");
        if (appMain) appMain.inert = mobileInspectorOpen;
        document.querySelectorAll("[data-inspector]").forEach((button) => {
          const object = resolveInspectorObject(button);
          button.dataset.resolvedInspector = object;
          if (button.matches(".lab-node, .graph-node")) {
            const selected = object === state.selectedGraphObject;
            button.setAttribute("aria-pressed", String(selected));
            button.tabIndex = selected ? 0 : -1;
          }
          if (button.closest(".mobile-evidence-list, .mobile-graph-list"))
            button.toggleAttribute(
              "aria-current",
              object === state.selectedGraphObject,
            );
        });
        document
          .querySelectorAll(".evidence-lab .lab-path path")
          .forEach((path, index) => {
            const relations = [
              ["topic", "source"],
              ["topic", "claim"],
              ["claim", "run"],
              ["claim", "draftEvidence"],
            ];
            path.classList.toggle(
              "related",
              relations[index]?.includes(state.selectedGraphObject) ?? false,
            );
          });
        document
          .querySelectorAll(".graph-canvas .lab-path path")
          .forEach((path, index) => {
            const relations = [
              ["topic", "source"],
              ["topic", "claim"],
              ["topic", "run"],
              ["topic", "draftEvidence"],
            ];
            path.classList.toggle(
              "related",
              relations[index]?.includes(state.selectedGraphObject) ?? false,
            );
          });
        if (state.pageState === "disabled") {
          document
            .querySelectorAll('[data-action="link-source"]')
            .forEach((button) => {
              button.disabled = true;
              button.setAttribute("aria-disabled", "true");
              const detail = button.querySelector("span");
              if (detail) detail.textContent = "引用能力未开放";
              else button.textContent = "引用能力未开放";
            });
        }
      }

      function render() {
        const pages = {
          today: todayPage,
          workbench: workbenchPage,
          knowledge: knowledgePage,
          collaboration: collaborationPage,
          system: systemPage,
        };
        const device = document.getElementById("device");
        device.dataset.viewport = state.viewport;
        device.innerHTML = `${shell()}<section class="app-main">${contextBar()}<div class="page-scroll">${pages[state.area]()}</div>${mobileNav()}</section>${inspector()}`;
        applyRenderedState(device);
        bindAppEvents();
        fitDevice();
      }

      function fitDevice() {
        const frame = document.getElementById("device-frame");
        const device = document.getElementById("device");
        const stage = document.getElementById("stage");
        const width = Number(state.viewport);
        const height =
          state.viewport === "1440"
            ? 900
            : state.viewport === "1024"
              ? 768
              : state.viewport === "390"
                ? 844
                : 720;
        const available = Math.max(280, stage.clientWidth - 28);
        const scale = Math.min(1, available / width);
        device.style.setProperty("--device-scale", scale.toFixed(4));
        frame.style.height = `${Math.ceil(height * scale)}px`;
      }

      function setArea(area) {
        state.area = area;
        state.inspectorOpen =
          state.viewport === "1440" || state.viewport === "1024";
        render();
      }

      function setWorkbench(key) {
        if (!workbenches[key]) return;
        state.workbench = key;
        if (state.area === "system") state.area = "workbench";
        state.inspectorOpen =
          state.viewport !== "390" && state.viewport !== "320";
        render();
      }

      function openInspector(object, trigger) {
        state.inspectorObject = object;
        if (
          ["topic", "source", "claim", "run", "draftEvidence"].includes(object)
        )
          state.selectedGraphObject = object;
        state.inspectorOpen = true;
        state.lastTrigger = trigger || document.activeElement;
        requestAnimationFrame(() => {
          render();
          requestAnimationFrame(() => {
            if (["390", "320"].includes(state.viewport))
              document
                .querySelector('[data-action="close-inspector"]')
                ?.focus();
            else restoreLastTriggerFocus();
          });
        });
      }

      function restoreTriggerFocus(trigger = state.lastTrigger) {
        if (!trigger) return;
        if (trigger.isConnected) {
          trigger.focus();
          return;
        }
        const key = trigger.dataset.inspector
          ? "inspector"
          : trigger.dataset.action
            ? "action"
            : null;
        if (!key) return;
        const value = trigger.dataset[key];
        const text = trigger.textContent.trim();
        const replacement = [
          ...document.querySelectorAll(`[data-${key}]`),
        ].find(
          (candidate) =>
            candidate.dataset[key] === value &&
            (!text || candidate.textContent.trim() === text),
        );
        if (replacement) replacement.focus();
        else {
          const heading = document.querySelector(".page-head h1");
          heading?.setAttribute("tabindex", "-1");
          heading?.focus();
        }
      }

      function restoreLastTriggerFocus() {
        restoreTriggerFocus(state.lastTrigger);
      }

      function closeInspector() {
        state.inspectorOpen = false;
        requestAnimationFrame(() => {
          render();
          requestAnimationFrame(restoreLastTriggerFocus);
        });
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("visible");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(
          () => toast.classList.remove("visible"),
          3200,
        );
      }

      function showDialog({
        title,
        body,
        confirmLabel,
        danger = false,
        onConfirm,
      }) {
        const overlay = document.getElementById("overlay");
        const trigger = document.activeElement;
        overlay.innerHTML = `<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-head"><strong id="dialog-title">${title}</strong><button class="icon-button" type="button" data-dialog-close aria-label="关闭">${icon("close")}</button></div><div class="dialog-body">${body}</div><div class="dialog-foot"><button class="button" type="button" data-dialog-close>取消</button><button class="button ${danger ? "danger" : "primary"}" type="button" data-dialog-confirm>${confirmLabel}</button></div></section>`;
        overlay.classList.add("open");
        overlay.setAttribute("aria-hidden", "false");
        const close = (restoreFocus = true) => {
          overlay.classList.remove("open");
          overlay.setAttribute("aria-hidden", "true");
          overlay.innerHTML = "";
          overlay.onclick = null;
          overlay.onkeydown = null;
          if (restoreFocus)
            requestAnimationFrame(() => restoreTriggerFocus(trigger));
        };
        overlay.onclick = (event) => {
          if (event.target.closest("[data-dialog-close]")) close();
          if (event.target.closest("[data-dialog-confirm]")) {
            close(false);
            onConfirm?.();
            requestAnimationFrame(() => restoreTriggerFocus(trigger));
          }
        };
        overlay.onkeydown = (event) => {
          if (event.key === "Escape") close();
          if (event.key !== "Tab") return;
          const focusable = [
            ...overlay.querySelectorAll("button, input, select"),
          ].filter((el) => !el.disabled);
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        };
        requestAnimationFrame(() =>
          overlay.querySelector("[data-dialog-close]")?.focus(),
        );
      }

      function toggleSourceLink() {
        if (state.pageState === "disabled") {
          showToast("引用能力尚未开放，当前不能提交");
          return;
        }
        const next = !state.sourceLinkedToLearning;
        showDialog({
          title: next ? "添加到学习工作台" : "从学习工作台移除",
          body: `<p>${next ? "这只会创建一个工作台引用。Source 的标题、版本、Space 和正式内容仍只有一份。" : "这只会删除学习工作台引用。研究工作台和知识库中的正式 Source 不受影响。"}</p><div class="code-block"><span>source:S-18</span><span>space:研究知识库</span><span>permission:当前服务端授权</span></div>`,
          confirmLabel: next ? "添加引用" : "移除引用",
          onConfirm: () => {
            state.sourceLinkedToLearning = next;
            render();
            showToast(
              next
                ? "已添加引用；正式对象没有复制"
                : "已移除引用；正式对象仍保留",
            );
          },
        });
      }

      function bindAppEvents() {
        document
          .querySelectorAll("[data-area]")
          .forEach((button) =>
            button.addEventListener("click", () =>
              setArea(button.dataset.area),
            ),
          );
        document
          .querySelectorAll("[data-workbench]")
          .forEach((button) =>
            button.addEventListener("click", () =>
              setWorkbench(button.dataset.workbench),
            ),
          );
        document
          .querySelectorAll("[data-inspector]")
          .forEach((button) =>
            button.addEventListener("click", () =>
              openInspector(button.dataset.resolvedInspector, button),
            ),
          );
        document.querySelectorAll("[data-module]").forEach((button) =>
          button.addEventListener("click", () => {
            const key = button.dataset.module;
            if (state.customModules.has(key)) state.customModules.delete(key);
            else state.customModules.add(key);
            render();
          }),
        );
        document
          .querySelector('[data-action="inspector"]')
          ?.addEventListener("click", (event) => {
            if (state.inspectorOpen) closeInspector();
            else openInspector(state.inspectorObject, event.currentTarget);
          });
        document
          .querySelector('[data-action="close-inspector"]')
          ?.addEventListener("click", closeInspector);
        const modalInspector = document.querySelector(
          '.inspector.open[aria-modal="true"]',
        );
        modalInspector?.addEventListener("keydown", (event) => {
          if (event.key !== "Tab") return;
          const focusable = [
            ...modalInspector.querySelectorAll(
              'button:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])',
            ),
          ];
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (!first || !last) return;
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        });
        document
          .querySelectorAll('[data-action="link-source"]')
          .forEach((button) =>
            button.addEventListener("click", toggleSourceLink),
          );
        document
          .querySelector('[data-action="retry"]')
          ?.addEventListener("click", () => {
            state.pageState = "ready";
            document.getElementById("prototype-state").value = "ready";
            render();
            showToast("已恢复到最新可用状态");
          });
        document
          .querySelector('[data-action="return-authorized"]')
          ?.addEventListener("click", () => {
            state.pageState = "ready";
            state.workbench = "learning";
            state.area = "workbench";
            state.inspectorOpen =
              state.viewport === "1440" || state.viewport === "1024";
            document.getElementById("prototype-state").value = "ready";
            render();
          });
        document
          .querySelector('[data-action="save-custom"]')
          ?.addEventListener("click", () => {
            state.customName =
              document.getElementById("custom-name")?.value.trim() ||
              "未命名工作台";
            state.customDescription =
              document.getElementById("custom-description")?.value.trim() ||
              "当前工作台没有说明。";
            state.pageState = "saving";
            document.getElementById("prototype-state").value = "saving";
            render();
            window.clearTimeout(state.saveTimer);
            state.saveTimer = window.setTimeout(
              () => {
                state.customVersion += 1;
                state.customSavedAt = new Date().toLocaleTimeString("zh-CN", {
                  hour: "2-digit",
                  minute: "2-digit",
                });
                state.pageState = "success";
                document.getElementById("prototype-state").value = "success";
                render();
                showToast("工作台配置已保存；正式对象和权限未改变");
              },
              state.reducedMotion ? 80 : 550,
            );
          });
        document
          .querySelector('[data-action="compare-config"]')
          ?.addEventListener("click", () =>
            showDialog({
              title: "比较工作台配置",
              body: '<div class="code-block"><strong>远端 v6</strong><span>+ 时间线</span><span>顺序：来源 → 证据 → 时间线</span></div><div class="code-block"><strong>本地 v5</strong><span>证据矩阵置顶</span><span>尚未包含远端时间线</span></div><p>保留本地设置会以远端 v6 为基线生成 v7，不会覆盖未读的远端版本。</p>',
              confirmLabel: "生成合并版本",
              onConfirm: () => {
                state.customModules.add("timeline");
                state.customOrder = "evidence-first";
                state.pageState = "ready";
                document.getElementById("prototype-state").value = "ready";
                render();
                showToast("已生成待保存的合并配置");
              },
            }),
          );
        document
          .querySelector('[data-action="delete-workbench"]')
          ?.addEventListener("click", () =>
            showDialog({
              title: "删除自定义工作台",
              body: "<p>将删除 4 个模块配置和 2 个工作台引用。不会删除 Source、Task、Topic 或任何正式对象。</p>",
              confirmLabel: "删除配置与引用",
              danger: true,
              onConfirm: () => showToast("已模拟删除配置；正式对象仍保留"),
            }),
          );
        document
          .querySelector('[data-action="delete-object"]')
          ?.addEventListener("click", () =>
            showDialog({
              title: "删除正式 Source",
              body: `<p>此操作将影响${state.sourceLinkedToLearning ? "研究和学习工作台中的所有可见引用" : "研究工作台中的可见引用"}。原型不会执行删除；正式产品需要近期认证、服务端授权和恢复路径。</p><div class="code-block"><span>visible references:${state.sourceLinkedToLearning ? 2 : 1}</span><span>target:source:S-18</span><span>action:formal deletion</span></div>`,
              confirmLabel: "仅查看影响，不删除",
              danger: true,
              onConfirm: () => showToast("原型未执行正式删除"),
            }),
          );
        document
          .querySelector('[data-action="search"]')
          ?.addEventListener("click", () =>
            showToast("全局搜索保持在统一 Shell，不形成第六个区域"),
          );
        document
          .querySelector('[data-action="open-origin"]')
          ?.addEventListener("click", () =>
            showToast(
              `已定位原始对象 ${inspectorData[state.inspectorObject]?.id || ""}`,
            ),
          );
        const nameInput = document.getElementById("custom-name");
        nameInput?.addEventListener("input", () => {
          state.customName = nameInput.value;
          const preview = document.querySelector(".custom-preview-name");
          if (preview) preview.textContent = nameInput.value || "未命名工作台";
        });
        const descriptionInput = document.getElementById("custom-description");
        descriptionInput?.addEventListener("input", () => {
          state.customDescription = descriptionInput.value;
          const preview = document.querySelector(".custom-preview-description");
          if (preview)
            preview.textContent =
              descriptionInput.value || "当前工作台没有说明。";
        });
        [
          ["custom-template", "customTemplate"],
          ["custom-space", "customSpace"],
          ["custom-icon", "customIcon"],
          ["custom-accent", "customAccent"],
          ["custom-view", "customView"],
          ["custom-filter", "customFilter"],
          ["custom-order", "customOrder"],
          ["custom-density", "customDensity"],
        ].forEach(([id, property]) =>
          document.getElementById(id)?.addEventListener("change", (event) => {
            state[property] = event.target.value;
            render();
            requestAnimationFrame(() => document.getElementById(id)?.focus());
          }),
        );
        document
          .querySelectorAll(".evidence-lab, .graph-canvas")
          .forEach((container) => {
            const nodes = [
              ...container.querySelectorAll(".lab-node, .graph-node"),
            ];
            nodes.forEach((node, index) =>
              node.addEventListener("keydown", (event) => {
                if (
                  ![
                    "ArrowLeft",
                    "ArrowRight",
                    "ArrowUp",
                    "ArrowDown",
                    "Home",
                    "End",
                  ].includes(event.key)
                )
                  return;
                event.preventDefault();
                const next =
                  event.key === "Home"
                    ? 0
                    : event.key === "End"
                      ? nodes.length - 1
                      : (index +
                          (["ArrowRight", "ArrowDown"].includes(event.key)
                            ? 1
                            : -1) +
                          nodes.length) %
                        nodes.length;
                const nextNode = nodes[next];
                state.selectedGraphObject = nextNode.dataset.resolvedInspector;
                applyRenderedState(document.getElementById("device"));
                nextNode.focus();
              }),
            );
          });
        document
          .querySelectorAll('[role="tab"][data-workbench]')
          .forEach((tab) =>
            tab.addEventListener("keydown", (event) => {
              if (
                !["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)
              )
                return;
              const tabs = [
                ...document.querySelectorAll('[role="tab"][data-workbench]'),
              ];
              let index = tabs.indexOf(event.currentTarget);
              if (event.key === "Home") index = 0;
              else if (event.key === "End") index = tabs.length - 1;
              else
                index =
                  (index +
                    (event.key === "ArrowRight" ? 1 : -1) +
                    tabs.length) %
                  tabs.length;
              event.preventDefault();
              setWorkbench(tabs[index].dataset.workbench);
              requestAnimationFrame(() =>
                document
                  .querySelector(
                    `[data-workbench="${state.workbench}"][role="tab"]`,
                  )
                  ?.focus(),
              );
            }),
          );
      }

      function initTheme() {
        const saved = localStorage.getItem("logion-workbench-prototype-theme");
        const theme = saved === "dark" || saved === "light" ? saved : "light";
        document.documentElement.dataset.theme = theme;
      }

      function updateToolIcons() {
        document.getElementById("theme-toggle").innerHTML = icon(
          document.documentElement.dataset.theme === "dark" ? "sun" : "moon",
        );
        document.getElementById("motion-toggle").innerHTML = icon("motion");
      }

      document.querySelectorAll("button[data-viewport]").forEach((button) =>
        button.addEventListener("click", () => {
          if (state.viewport === button.dataset.viewport) return;
          state.viewport = button.dataset.viewport;
          state.inspectorOpen = !["390", "320"].includes(state.viewport);
          document
            .querySelectorAll("button[data-viewport]")
            .forEach((item) =>
              item.setAttribute("aria-pressed", String(item === button)),
            );
          render();
        }),
      );

      document
        .getElementById("prototype-state")
        .addEventListener("change", (event) => {
          state.pageState = event.target.value;
          render();
        });
      document.getElementById("theme-toggle").addEventListener("click", () => {
        const next =
          document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        localStorage.setItem("logion-workbench-prototype-theme", next);
        updateToolIcons();
      });
      document
        .getElementById("motion-toggle")
        .addEventListener("click", (event) => {
          state.reducedMotion = !state.reducedMotion;
          document.documentElement.dataset.reducedMotion = String(
            state.reducedMotion,
          );
          event.currentTarget.setAttribute(
            "aria-pressed",
            String(state.reducedMotion),
          );
          showToast(
            state.reducedMotion ? "已减少非必要动态" : "已恢复受控状态动态",
          );
        });
      window.addEventListener("resize", fitDevice);
      window.addEventListener("keydown", (event) => {
        if (
          event.key === "Escape" &&
          document.getElementById("overlay").classList.contains("open")
        )
          return;
        if (
          event.key === "Escape" &&
          state.inspectorOpen &&
          ["390", "320"].includes(state.viewport)
        )
          closeInspector();
        if (
          (event.ctrlKey || event.metaKey) &&
          event.key.toLowerCase() === "k"
        ) {
          event.preventDefault();
          showToast("全局搜索保持在统一 Shell，不形成第六个区域");
        }
      });

      initTheme();
      updateToolIcons();
      render();
    </script>
  </body>
</html>
