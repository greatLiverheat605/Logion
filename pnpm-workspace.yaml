packages:
  - apps/mobile
  - apps/web
  - packages/*

allowBuilds:
  sharp: true
  unrs-resolver: true

overrides:
  # This plugin only uses globSync(pattern, { onlyDirectories: true }). Reuse the
  # existing compatible globber to remove the vulnerable fast-glob -> braces chain.
  "@next/eslint-plugin-next@16.3.6>fast-glob": npm:tinyglobby@0.2.17
  "ajv@>=7.0.0": 8.20.0
  brace-expansion: 5.0.12
  fast-uri: 3.1.8
  "js-yaml@>=4.0.0 <5.0.0": 4.3.2
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.4

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
  minimatch@5.1.9: patches/minimatch@5.1.9.patch
  sonner@2.0.8: patches/sonner@2.0.8.patch

# Browser-only PDF rendering does not need the optional native Node canvas.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"
